function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;}
let decks={};
function pickRound(id){const key=id+":"+level();const pool=data[id].filter(q=>q.level===level());if(!decks[key]||decks[key].length<5){decks[key]=shuffle(pool.map((_,i)=>i));}const chosen=decks[key].splice(0,5);return chosen.map(i=>{const q=pool[i];return {...q,a:shuffle(q.a.map((option,j)=>({option,original:j})))}});}
function level(){return $('difficulty').value;}

function renderLeaderboard(){const a=readScores().slice(0,8),list=$('leaderList');list.replaceChildren();if(!a.length){const li=document.createElement('li');li.textContent=labels[language].empty;list.append(li);return;}a.forEach(x=>{const li=document.createElement('li');const cat=categories.find(c=>c.id===x.cat);li.textContent=`${cat?cat[language]:x.cat} · ${labels[language][x.level]||x.level} — ${x.score}/${x.total}`;list.append(li)})}
function renderHome(){const container=$('categories');container.replaceChildren();categories.forEach(cat=>{const b=document.createElement('button');b.className='card';b.type='button';const emoji=document.createElement('span');emoji.className='emoji';emoji.textContent=cat.emoji;const title=document.createElement('strong');title.textContent=cat[language];const sub=document.createElement('span');sub.className='muted';sub.textContent=t().start;b.append(emoji,title,sub);b.addEventListener('click',()=>start(cat.id));container.append(b)});renderLeaderboard()}
function translate(){document.documentElement.lang=language==='km'?'km':'en';['tagline','welcome','choose'].forEach(id=>$(id).textContent=t()[id]);$('lang').textContent=t().lang;$('back').textContent=t().back;$('again').textContent=t().again;$('homeButton').textContent=t().home;$('difficultyLabel').textContent=labels[language].difficulty;$('leaderTitle').textContent=labels[language].leader;$('leaderHint').textContent=labels[language].local;[...$('difficulty').options].forEach(o=>o.textContent=`${labels[language][o.value]} · ${levels[o.value]}s`);renderHome();if(current){if(!$('quiz').classList.contains('hidden'))renderQuestion(false);if(!$('results').classList.contains('hidden'))renderResults()}}
function show(which){['home','quiz','results'].forEach(id=>$(id).classList.toggle('hidden',id!==which));window.scrollTo(0,0)}
function stopTimer(){if(timer!==null){clearInterval(timer);timer=null}}
function startTimer(){stopTimer();limit=levels[level()];remaining=limit;updateTimer();timer=setInterval(()=>{remaining=Math.max(0,remaining-.1);updateTimer();if(remaining<=0){stopTimer();choose(-1)}},100)}
function updateTimer(){$('timeLeft').textContent=`${Math.ceil(remaining)}s`;$('timerFill').style.width=`${Math.max(0,remaining/limit*100)}%`;$('timerFill').classList.toggle('urgent',remaining<=5)}
function start(id){stopTimer();current=id;roundQuestions=pickRound(id);index=0;score=0;selected=null;locked=false;$('difficulty').disabled=true;show('quiz');renderQuestion(true)}
function renderQuestion(restart){const q=roundQuestions[index];$('categoryName').textContent=categories.find(x=>x.id===current)[language];$('count').textContent=`${t().question} ${index+1} / ${roundQuestions.length}`;$('levelTag').textContent=labels[language][level()];$('progress').style.width=`${(index+1)/roundQuestions.length*100}%`;$('question').textContent=tr(q.q);$('answers').replaceChildren();q.a.forEach((item,i)=>{const b=document.createElement('button');b.type='button';b.className='answer';b.textContent=`${String.fromCharCode(65+i)}. ${tr(item.option)}`;if(locked){b.disabled=true;if(item.original===q.c)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')}b.addEventListener('click',()=>choose(i));$('answers').append(b)});$('feedback').textContent=!locked?'':selected===-1?`${labels[language].time} ${t().wrong} ${tr(q.a.find(x=>x.original===q.c).option)}`:q.a[selected].original===q.c?t().correct:`${t().wrong} ${tr(q.a.find(x=>x.original===q.c).option)}`;$('next').textContent=index===roundQuestions.length-1?t().finish:t().next;$('next').disabled=!locked;if(restart)startTimer()}
function choose(i){if(locked)return;locked=true;selected=i;stopTimer();if(i>=0&&roundQuestions[index].a[i].original===roundQuestions[index].c)score++;renderQuestion(false)}
function renderResults(){$('score').textContent=`${score} / ${roundQuestions.length}`;$('resultTitle').textContent=t().resultTitle;$('resultText').textContent=t().resultText;$('resultLevel').textContent=labels[language][level()];const matching=readScores().filter(x=>x.cat===current&&x.level===level());$('bestScore').textContent=`${labels[language].best}: ${matching.length?Math.max(...matching.map(x=>x.score)):score}/${roundQuestions.length}`}
function finish(){stopTimer();saveScore();$('difficulty').disabled=false;show('results');renderResults()}
$('next').addEventListener('click',()=>{if(!locked)return;if(index===roundQuestions.length-1){finish();return}index++;selected=null;locked=false;renderQuestion(true)});
$('back').addEventListener('click',()=>{stopTimer();$('difficulty').disabled=false;show('home');renderLeaderboard()});
$('again').addEventListener('click',()=>start(current));
